<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retail Intelligence · SIH 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#080D18; --bg2:#0A1020; --sidebar:#0B1120;
    --card:linear-gradient(145deg,#151E31 0%,#101827 100%); --card2:#0F1726;
    --edge:rgba(80,110,170,.25); --edge2:rgba(148,163,184,.12);
    --txt:#F1F5F9; --txt2:#D8E0ED; --sub:#A8B3C7; --muted:#77839A;
    --blue:#3B82F6; --purple:#8B5CF6; --orange:#F59E0B; --teal:#2DD4BF;
    --green:#34D399; --green2:#4ADE80; --red:#FB7185; --warn:#F59E0B;
    --yellow:#FBBF24; --gold:#FACC15; --cyan:#22D3EE; --pink:#EC4899; --indigo:#6366F1;
    --radius:16px; --shadow:0 12px 34px rgba(0,0,0,.45); --glow:0 0 24px rgba(59,130,246,.25);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:
      radial-gradient(1100px 520px at 85% -10%, rgba(59,130,246,.16), transparent 60%),
      radial-gradient(900px 480px at -5% 110%, rgba(139,92,246,.10), transparent 55%),
      var(--bg);
    color:var(--txt); font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ============================================================ layout shell */
  .shell{display:flex; height:100vh; width:100vw}
  main{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; background:var(--bg2)}

  /* sidebar */
  aside{width:240px; flex:none; background:var(--sidebar); border-right:1px solid var(--edge2);
    display:flex; flex-direction:column; padding:18px 14px; gap:4px;
    transition:margin-left .28s ease, width .28s ease; z-index:40}
  aside.collapsed{margin-left:-240px}
  .brand{display:flex; align-items:center; gap:11px; padding:4px 6px 16px; border-bottom:1px solid var(--edge2); margin-bottom:12px}
  .brand .logo{width:38px; height:38px; border-radius:11px; flex:none;
    background:linear-gradient(135deg,var(--blue),var(--purple));
    display:grid; place-items:center; box-shadow:0 4px 14px rgba(59,130,246,.4)}
  .brand .logo svg{width:20px; height:20px; color:#fff}
  .brand .nm{font-size:14px; font-weight:800; letter-spacing:.2px; line-height:1.1}
  .brand .st{font-size:10px; color:var(--muted); font-weight:600; letter-spacing:1.6px}
  nav{display:flex; flex-direction:column; gap:2px; overflow:auto; flex:1}
  .nav-item{display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:10px;
    color:var(--muted); font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid transparent;
    transition:.2s; user-select:none}
  .nav-item svg{width:17px; height:17px; flex:none; opacity:.85}
  .nav-item:hover{color:var(--txt); background:rgba(59,130,246,.08)}
  .nav-item.active{color:#fff; background:linear-gradient(90deg,rgba(59,130,246,.24),rgba(59,130,246,.07));
    border-color:rgba(59,130,246,.45); box-shadow:0 0 16px rgba(59,130,246,.15)}
  .nav-item.active svg{color:var(--blue)}
  .nav-sep{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1.4px;
    padding:16px 11px 6px; font-weight:700; opacity:.7}
  .sys{flex:none; margin-top:10px; padding:11px; border:1px solid var(--edge2); border-radius:12px;
    background:var(--card2)}
  .sys .row{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green);
    animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .sys .sub{color:var(--muted); font-size:10.5px; margin-top:4px; padding-left:16px}
  .user{display:flex; align-items:center; gap:9px; padding:10px 6px 0; margin-top:8px; border-top:1px solid var(--edge2)}
  .avatar{width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#F97316,#EC4899);
    display:grid; place-items:center; font-size:12px; font-weight:800; color:#fff}
  .user .nm{font-size:12.5px; font-weight:700}
  .user .em{font-size:10px; color:var(--muted)}

  /* topbar */
  .topbar{flex:none; display:flex; align-items:center; gap:14px; padding:13px 28px;
    background:rgba(10,16,32,.65); backdrop-filter:blur(10px); border-bottom:1px solid var(--edge2)}
  .hamburger{background:none; border:none; color:var(--muted); cursor:pointer; padding:4px}
  .hamburger svg{width:22px; height:22px}
  .topbar h1{font-size:17px; font-weight:800}
  .topbar .crumb{font-size:12px; color:var(--muted); font-weight:600}
  .top-actions{margin-left:auto; display:flex; align-items:center; gap:10px}
  .conn{font-size:11px; padding:4px 11px; border-radius:20px; border:1px solid var(--edge);
    background:var(--card); color:var(--muted); white-space:nowrap}
  .conn.live{color:var(--green); border-color:#1d6a4e; background:#0f2419}
  .conn.off{color:var(--muted)}
  .btn{border:none; border-radius:10px; padding:9px 15px; font-size:13px; font-weight:700; cursor:pointer;
    transition:.18s; display:inline-flex; align-items:center; gap:8px}
  .btn svg{width:15px; height:15px}
  .btn.solid{background:linear-gradient(135deg,var(--blue),#2563eb); color:#fff}
  .btn.solid:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--card); color:var(--muted); border:1px solid var(--edge)}
  .btn.ghost:hover{color:var(--txt); border-color:#365193}

  /* ============================================================ content */
  .content{flex:1; overflow:auto; padding:34px}
  .view{display:none; animation:fade .28s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
  .hidden{display:none!important}

  /* welcome row */
  .hero{display:flex; align-items:flex-end; gap:14px; margin-bottom:24px; flex-wrap:wrap}
  .hero h2{font-size:36px; font-weight:700; letter-spacing:-.5px; color:var(--txt); line-height:1.1}
  .hero p{color:var(--sub); font-size:16px; margin-top:4px}
  .hero .date{margin-left:auto; font-size:12.5px; color:var(--sub); background:var(--card);
    border:1px solid var(--edge); padding:9px 15px; border-radius:12px; font-weight:600; white-space:nowrap}

  /* ============================================================ metric cards */
  .cards{display:grid; gap:18px; margin-bottom:8px}
  @media(min-width:1180px){.cards{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:720px) and (max-width:1179.98px){.cards{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:719.98px){.cards{grid-template-columns:1fr}}
  .metric{position:relative; cursor:pointer; min-height:190px; padding:18px;
    background:linear-gradient(145deg,#151E31 0%,#101827 100%);
    border:1px solid rgba(80,110,170,.25); border-top:2px solid var(--acc,#3B82F6); border-radius:16px;
    display:flex; flex-direction:column; gap:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.20), 0 0 25px color-mix(in srgb, var(--acc,#3B82F6) 14%, transparent);
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    overflow:hidden}
  .metric::before{content:""; position:absolute; inset:0; pointer-events:none; opacity:.55;
    background:radial-gradient(520px 150px at 15% -15%, color-mix(in srgb, var(--acc,#3B82F6) 20%, transparent), transparent 60%)}
  .metric .glow{position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .3s;
    background:radial-gradient(600px 170px at 25% 0, var(--acc,#3B82F6), transparent 60%)}
  .metric:hover{transform:translateY(-5px);
    border-color:color-mix(in srgb, var(--acc,#3B82F6) 55%, transparent);
    box-shadow:0 18px 40px rgba(0,0,0,.30), 0 0 35px color-mix(in srgb, var(--acc,#3B82F6) 26%, transparent)}
  .metric:hover .glow{opacity:.10}
  .metric .m-top{display:flex; align-items:center; justify-content:space-between}
  .metric .m-ico{width:38px; height:38px; border-radius:11px; flex:none; display:grid; place-items:center;
    background:color-mix(in srgb, var(--acc,#3B82F6) 15%, transparent); color:var(--acc,#3B82F6);
    box-shadow:0 0 18px color-mix(in srgb, var(--acc,#3B82F6) 12%, transparent)}
  .metric .m-ico svg{width:20px; height:20px}
  .metric .m-arr{width:28px; height:28px; border-radius:50%; flex:none; display:grid; place-items:center;
    border:1px solid var(--edge); color:var(--acc,#3B82F6); transition:.22s}
  .metric .m-arr svg{width:13px; height:13px}
  .metric:hover .m-arr{border-color:color-mix(in srgb, var(--acc,#3B82F6) 60%, transparent);
    background:color-mix(in srgb, var(--acc,#3B82F6) 10%, transparent)}
  .metric:hover .m-arr svg{transform:translateX(2px)}
  .metric .m-title{font-size:13.5px; font-weight:600; color:var(--txt2); margin-top:6px; letter-spacing:.1px}
  .metric .m-val{font-size:34px; font-weight:700; letter-spacing:-1px; line-height:1.05; color:#F8FAFC; margin-top:1px}
  .metric .m-sub{font-size:12px; color:var(--sub)}
  .metric .m-trend{margin-top:4px; display:flex; flex-direction:column; gap:2px; line-height:1.1}
  .metric .m-trend .t1{font-weight:800; font-size:13px; letter-spacing:.2px}
  .metric .m-trend .t1.up{color:var(--green2)}
  .metric .m-trend .t1.down{color:var(--red)}
  .metric .m-trend .t1.warn{color:#FB923C}
  .metric .m-trend .t1.flat{color:var(--sub)}
  .metric .m-trend .t2{font-size:11px; color:var(--muted); font-weight:500}
  .metric .foot{margin-top:auto; padding-top:10px; border-top:1px solid var(--edge2); display:flex; align-items:center}
  .metric .hint{font-size:10.5px; color:var(--muted)}
  .upload-cta{display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer; color:inherit;
    background:color-mix(in srgb, var(--acc,#3B82F6) 10%, transparent);
    border:1px solid color-mix(in srgb, var(--acc,#3B82F6) 35%, transparent);
    border-radius:10px; padding:7px 10px; transition:.2s; font-family:inherit}
  .upload-cta:hover{background:color-mix(in srgb, var(--acc,#3B82F6) 19%, transparent);
    border-color:color-mix(in srgb, var(--acc,#3B82F6) 60%, transparent)}
  .upload-cta .u-ic{width:26px; height:26px; border-radius:8px; flex:none; display:grid; place-items:center;
    background:color-mix(in srgb, var(--acc,#3B82F6) 22%, transparent); color:var(--acc,#3B82F6)}
  .upload-cta .u-ic svg{width:13px; height:13px}
  .upload-cta .u-txt{display:flex; flex-direction:column; gap:1px; min-width:0}
  .upload-cta .u-main{font-size:11.5px; font-weight:700; color:#E6EDFA}
  .upload-cta .u-help{font-size:10px; color:var(--muted)}
  .mini-status{display:flex; gap:10px; margin-top:5px; font-size:10px; color:#8FA0B8}
  .mini-status .s{display:inline-flex; align-items:center; gap:5px}
  .mini-status .d{width:6px;height:6px;border-radius:50%}
  .d.green{background:var(--green)} .d.amber{background:var(--warn)} .d.red{background:var(--red)}

  /* ============================================================ AI banner */
  .ai-banner{margin-top:26px; display:flex; align-items:center; gap:16px; padding:18px 22px;
    border-radius:18px; background:linear-gradient(90deg, rgba(250,204,21,.10), rgba(20,28,45,.90) 60%);
    border:1px solid rgba(250,204,21,.25); box-shadow:0 10px 30px rgba(0,0,0,.20); position:relative; overflow:hidden}
  .ai-banner::after{content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(420px 100px at 8% 0, rgba(250,204,21,.14), transparent 60%)}
  .ai-banner .bulb{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;
    background:rgba(250,204,21,.12); color:var(--gold); box-shadow:0 0 20px rgba(250,204,21,.22)}
  .ai-banner .bulb svg{width:24px;height:24px}
  .ai-banner .tag{font-size:10px; font-weight:800; letter-spacing:1.8px; color:var(--gold); text-transform:uppercase}
  .ai-banner .msg{font-size:14.5px; font-weight:600; line-height:1.4; color:var(--txt)}
  .ai-banner .none{color:var(--muted); font-weight:500}
  .dashboard-hint{display:flex; align-items:center; justify-content:center; gap:8px; text-align:center;
    color:#8F9BB0; font-size:14px; margin-top:22px}
  .dashboard-hint svg{width:15px; height:15px; flex:none}

  /* ============================================================ analytics pages */
  .analytics-header{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:16px}
  .analytics-header .back{background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px;
    display:inline-flex; align-items:center; gap:6px; margin-top:3px; font-weight:600}
  .analytics-header .back:hover{color:var(--txt)}
  .analytics-header h2{font-size:21px; font-weight:800}
  .analytics-header .sub{color:var(--muted); font-size:12.5px; margin-top:3px}
  .analytics-header .actions{margin-left:auto; display:flex; gap:10px; align-items:center}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px}
  .stat{background:var(--card); border:1px solid var(--edge); border-radius:13px; padding:13px 15px}
  .stat .k{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:700}
  .stat .v{font-size:22px; font-weight:800; margin-top:3px}
  .tabs{display:inline-flex; gap:4px; background:var(--card); border:1px solid var(--edge); padding:4px; border-radius:11px; margin-bottom:14px}
  .tab{padding:8px 16px; border-radius:8px; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer;
    border:none; background:none; transition:.18s}
  .tab.active{background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(59,130,246,.08)); color:#fff}
  .tab-pane{display:none} .tab-pane.active{display:block; animation:fade .25s}
  .panel{background:var(--card); border:1px solid var(--edge); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:16px}
  .panel h3{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.2px; font-weight:700; margin-bottom:10px}
  .grid2{display:grid; grid-template-columns:1.5fr 1fr; gap:16px}
  .grid2b{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  @media(max-width:980px){.grid2,.grid2b{grid-template-columns:1fr}}
  .chart-hold{height:260px; position:relative}
  .chart-hold.sm{height:200px}
  img.media{width:100%; border-radius:10px; border:1px solid var(--edge); background:#000; aspect-ratio:16/9; object-fit:contain}
  table{width:100%; border-collapse:collapse; font-size:12.5px}
  th{text-align:left; color:var(--muted); font-weight:700; padding:8px; border-bottom:1px solid var(--edge)}
  td{padding:8px; border-bottom:1px solid var(--edge2)}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700}
  .badge.FULL,.badge.IN_STOCK,.badge.OK,.badge.NORMAL,.badge.ONLINE{background:#0f2419;color:var(--green);border:1px solid #1d6a4e}
  .badge.LOW,.badge.LOW_STOCK,.badge.WARNING,.badge.RECONNECTING,.badge.MEDIUM{background:#2c2110;color:var(--yellow);border:1px solid #7a5d1a}
  .badge.OUT,.badge.OUT_OF_STOCK,.badge.HIGH,.badge.OFFLINE,.badge.ERROR{background:#2a1220;color:var(--red);border:1px solid #7f1d2b}
  .badge.INFO,.badge.dim{background:var(--card2);color:var(--muted)}
  .badge.blend{background:#0f2242;color:#7fb2ff;border:1px solid #2a5fa0}
  .badge.model{background:#0f2419;color:var(--green);border:1px solid #1d6a4e}
  .badge.fallback{background:#2c2110;color:var(--warn,var(--yellow));border:1px solid #7a5d1a}
  .badge.OPPORTUNITY{background:#0f2242;color:#7fb2ff;border:1px solid #2a5fa0}
  .pill-pr{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800}
  .pr.high{background:#2a1220;color:var(--red);border:1px solid #7f1d2b}
  .pr.medium{background:#2c2110;color:var(--yellow);border:1px solid #7a5d1a}
  .pr.opportunity{background:#0f2242;color:#7fb2ff;border:1px solid #2a5fa0}
  .empty{padding:40px 20px; text-align:center; color:var(--muted)}
  .empty svg{width:44px;height:44px;opacity:.4;margin-bottom:12px}
  .empty .t{font-weight:700; color:var(--txt); font-size:14px; margin-bottom:4px}
  .empty .s{font-size:12.5px}

  /* ============================================================ upload modal */
  .modal-overlay{position:fixed; inset:0; z-index:100; background:rgba(4,8,18,.7); backdrop-filter:blur(6px);
    display:grid; place-items:center; padding:20px; animation:fade .2s}
  .modal-overlay.hidden{display:none}
  .modal{width:100%; max-width:520px; background:var(--card); border:1px solid var(--edge); border-radius:18px;
    padding:24px; box-shadow:var(--shadow); animation:pop .24s ease; max-height:90vh; overflow:auto}
  @keyframes pop{from{opacity:0; transform:scale(.96) translateY(8px)}to{opacity:1; transform:none}}
  .modal .m-head{display:flex; align-items:center; gap:12px; margin-bottom:16px}
  .modal .m-head .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--acc,var(--blue));
    background:color-mix(in srgb, var(--acc,var(--blue)) 20%, transparent)}
  .modal .m-head .ico svg{width:24px;height:24px}
  .modal .m-head h3{font-size:17px; font-weight:800}
  .modal .m-head p{color:var(--muted); font-size:12px; margin-top:2px}
  .modal .close{margin-left:auto; background:none; border:none; color:var(--muted); cursor:pointer; font-size:20px; line-height:1}
  .drop{border:2px dashed #365193; border-radius:14px; padding:30px 18px; text-align:center; cursor:pointer;
    transition:.2s; background:var(--card2)}
  .drop:hover,.drop.over{border-color:var(--blue); background:rgba(59,130,246,.06)}
  .drop .ic{color:var(--blue); opacity:.85; margin-bottom:8px}
  .drop .ic svg{width:34px;height:34px}
  .drop .t{font-size:14px; font-weight:700}
  .drop .s{font-size:12px; color:var(--muted); margin-top:4px}
  .drop .fmt{margin-top:10px; font-size:10.5px; color:var(--muted); letter-spacing:.4px}
  .file-row{display:flex; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--edge);
    border-radius:11px; padding:11px 13px; margin-top:14px}
  .file-row .n{font-size:13px; font-weight:700; flex:1}
  .file-row .sz{color:var(--muted); font-size:11.5px}
  .modal .m-foot{margin-top:18px; display:flex; gap:10px; justify-content:flex-end}
  .analyzing{text-align:center; padding:8px 0}
  .analyzing .spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--edge);border-top-color:var(--blue);
    margin:0 auto 14px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .analyzing .steps{display:flex;flex-direction:column;gap:6px;margin-top:14px;text-align:left;max-width:280px;margin-left:auto;margin-right:auto}
  .analyzing .steps .st{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .analyzing .steps .st.done{color:var(--green)} .analyzing .steps .st.done svg{color:var(--green)}
  .analyzing .steps .st.cur{color:var(--txt)}
  .analyzing .steps svg{width:14px;height:14px}

  /* suggestions */
  .rec-card{border:1px solid var(--edge); border-radius:var(--radius); padding:16px; background:var(--card); margin-bottom:12px;
    border-left:4px solid var(--pc,#8B5CF6)}
  .rec-card .r-top{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .rec-card .r-top .cat{font-weight:800; font-size:13px}
  .rec-card .r-text{font-size:14px; color:var(--txt); line-height:1.45}
  .rec-card .r-impact{font-size:12px; color:var(--muted); margin-top:8px}
  .rec-card .r-impact b{color:var(--green)}
  @media(max-width:720px){
    aside{position:absolute; left:0; top:0; bottom:0; box-shadow:var(--shadow)}
    aside.collapsed{margin-left:-240px}
    .content{padding:22px}
    .hero h2{font-size:28px}
  }
</style>
</head>
<body>
<div class="shell">
  <!-- ======================================================== SIDEBAR -->
  <aside id="sidebar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 14h.01M15 14h.01"/></svg></div>
      <div><div class="nm">Retail Intelligence</div><div class="st">SIH 2026</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="sys">
      <div class="row"><span class="dot"></span>System Online</div>
      <div class="sub" id="sysSub">Websocket connecting…</div>

<script>
const $=id=>document.getElementById(id);
const KINDS={
  entry_exit:{title:'Upload Entry/Exit Video',desc:'Analyze store entry and exit',kind:'entry_exit'},
  counter:{title:'Upload Counter Video',desc:'Analyze checkout queue',kind:'counter'},
  shelf:{title:'Upload Shelf Video',desc:'Analyze shelf inventory',kind:'shelf'}
};
let SNAP=null, HIST={minutes:[],hourly:[],daily:[],peak_hours:[],activity:{}}, RUNS=[], REC=null, CFG=null;
let charts={}, currentView='dashboard', sidebarOpen=true;

// ---------------------------------------------------------------- helpers
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>(typeof v==='number'&&isFinite(v))?v:null;
const mean=a=>{a=(a||[]).filter(x=>typeof x==='number'&&isFinite(x)&&x>0);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;};
const dAvg=d=>d&&typeof d==='object'?mean(Object.values(d)):null;
function fmtSec(s){s=num(s);if(s==null)return '—';if(s<60)return Math.round(s)+'s';const m=Math.floor(s/60),r=Math.round(s%60);return `${m}m ${r}s`;}
function fmtTime(t){return t?new Date(t*1000).toTimeString().slice(0,5):'—';}
function fmtDate(t){return t?new Date(t*1000).toLocaleDateString():'—';}
function badge(s){const b=String(s??'OK').toUpperCase().replace(/[^A-Z_]/g,'');
  const cls=['FULL','IN_STOCK','OUT','OUT_OF_STOCK','LOW','LOW_STOCK','OK','NORMAL','INFO','WARNING','HIGH','ONLINE','OFFLINE','ERROR','RECONNECTING','blend','model','fallback'].includes(b)?b:'dim';
  return `<span class="badge ${cls}">${esc(s??'—')}</span>`;}
function chart(id,cfg){if(charts[id])charts[id].destroy();charts[id]=new Chart($(id),cfg);return charts[id];}
const baseOpts={responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},
  scales:{x:{ticks:{color:'#8F9AB3',maxTicksLimit:8,font:{size:10}},grid:{color:'#1A2749'}},
  y:{beginAtZero:true,ticks:{color:'#8F9AB3',font:{size:10}},grid:{color:'#1A2749'}}},
  plugins:{legend:{labels:{color:'#8F9AB3',boxWidth:12,font:{size:10}}}}};

const CUR=()=>SNAP||null;
const E=id=>document.getElementById(id);
function setTxt(id,v){const x=E(id);if(x)x.textContent=v==null||v===''?'—':v;}

// ----------------------------------------------------------- flicker-free live updates
// views are fully re-built only when the data source changes (live<->idle, run id);
// otherwise charts/heatmaps are patched in place so nothing blinks on each snapshot.
let built={}, lastApply={};
const LIVE_MS={dashboard:2500,occupancy:3000,queue:3000,shelf:3500,dwell:3000,suggestions:4500,reports:6000,settings:10000};
const viewSig=()=>`${SNAP?'live':'idle'}|${RUNS[0]?RUNS[0].id:'none'}`;
function pick(v,ms){const n=Date.now();if(n-(lastApply[v]||0)>=ms){lastApply[v]=n;return true;}return false;}
function liveApply(v){
  if(!pick(v,LIVE_MS[v]||3000))return;
  const s=viewSig();
  if(built[v]!==s){built[v]=s;render(v);}
  else if(PATCHES[v])PATCHES[v]();
  else render(v);
}
const PATCHES={
  dashboard:patchDashboard, occupancy:patchOccupancy, queue:patchQueue,
  shelf:patchShelf, dwell:patchDwell, suggestions:null, reports:null, settings:null
};
function setTrend(sel,tr){
  const el=document.querySelector(sel); if(!el)return;
  const t1=el.querySelector('.t1'), t2=el.querySelector('.t2'); if(!t1)return;
  el.classList.toggle('hidden',!tr);
  if(tr){t1.textContent=tr.txt;t1.className='t1 '+tr.dir;if(t2)t2.textContent=tr.at||'';}
}
function setBy(sel,v){const el=document.querySelector(sel);if(el)el.textContent=v;}
function upChart(id,fn){const ch=charts[id];if(ch&&fn)fn(ch);}

// ---------------------------------------------------------------- sidebar nav

  {id:'dwell',label:'Dwell Time',icon:'M12 8v4l3 3M21 12a9 9 0 11-18 0 9 9 0 0118 0z'},

];

  {id:'reports',label:'Reports',icon:'M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6'},

];

// ---------------------------------------------------------------- routing
function showView(name){
  currentView=name;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el=E('view-'+name); if(el)el.classList.add('active');

  $('pageTitle').textContent=meta[0]; $('pageSub').textContent=meta[1];

// ---------------------------------------------------------------- render dispatch
function render(name){
  if(name==='dashboard')renderDashboard();
  else if(name==='occupancy')renderOccupancy();
  else if(name==='queue')renderQueue();
  else if(name==='shelf')renderShelf();
  else if(name==='dwell')renderDwell();
  else if(name==='suggestions')renderSuggestions();
  else if(name==='reports')renderReports();
  else if(name==='settings')renderSettings();
}

// ================================================================ DASHBOARD
function dashCompute(){
  const c=CUR(); const live=!!c;
  const f=c?.footfall||{}, q=c?.queues||{}, r=c?.reid||{}, d=c?.dwell||{}, sh=c?.shelves||[];
  const al=c?.alerts?.active||[]; const sev=c?.alerts?.by_severity||{};
  const sm=!live&&RUNS[0]?RUNS[0].summary:null;
  const today=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  const trend=(cur,prev,warnUp)=>{if(num(cur)==null||num(prev)==null)return null;
    if(prev===0)return{dir:cur>0?(warnUp?'warn':'up'):'flat',txt:cur>0?'↑ new':'—',at:'vs. last analysis'};
    const p=Math.round((cur-prev)/prev*100); const up=p>0;
    const dir=p===0?'flat':up?(warnUp?'warn':'up'):'down';
    return{dir,txt:`${up?'↑':'↓'} ${Math.abs(p)}%`,at:'vs. last analysis'};};

  const occ=num(f.occupancy)??num(sm?.occupancy);
  const occTrend=trend(occ,sm?sm.occupancy:null);
  const uni=num(r.unique_shoppers??f.unique_shoppers)??num(sm?.unique_shoppers);
  const uniTrend=trend(uni,sm?sm.unique_shoppers:null);
  const queueTotal=num(q.total)??num(sm?.queue_total);
  const queueTrend=trend(queueTotal,sm?sm.queue_total:null,true);
  const dwAvg=live?dAvg(d?.avg_dwell_s):num(sm?.avg_dwell_s);
  const dwellTrend=trend(dwAvg,sm?sm.avg_dwell_s:null);
  const dwTxt=dwAvg!=null?(function(s){if(s<60)return Math.round(s)+'s';return (s/60).toFixed(1)+' min';})(dwAvg):'—';
  const shelfOut=(sh.filter(x=>['OUT','OUT_OF_STOCK'].includes(x.status)).length)+(sm?sm.shelf_out:0);
  const shelfLow=(sh.filter(x=>['LOW','LOW_STOCK'].includes(x.status)).length)+(sm?sm.shelf_low:0);
  const shelfTotal=(sh.length)||(sm?sm.shelf_total:0);
  const shelfHealth=shelfTotal?Math.max(0,100-Math.round((shelfOut+shelfLow)/shelfTotal*100)):null;
  const aiCount=(al.length)+(REC?1:0);
  return {live,f,q,r,d,sh,al,sev,sm,today,trend,
    occ,occTrend,uni,uniTrend,queueTotal,queueTrend,dwAvg,dwellTrend,dwTxt,
    shelfOut,shelfLow,shelfTotal,shelfHealth,aiCount,rec:REC};
}
function renderDashboard(){
  const {occ,occTrend,uni,uniTrend,queueTotal,queueTrend,dwTxt,dwellTrend,shelfHealth,shelfOut,shelfLow,shelfTotal,aiCount,live,rec,today}=dashCompute();
  $('view-dashboard').innerHTML=`
    <div class="hero">
      <div>

        <p>Here's what's happening in your store today.</p>
      </div>
      <div class="date">${today}</div>
    </div>

    <div class="cards">
      ${card('Occupancy','occupancy','#3B82F6',
        'M16 11a4 4 0 10-8 0 4 4 0 008 0zM2 21c0-4 4-6 8-6s8 2 8 6',
        occ!==null?occ:'—','People currently in store',occTrend,uploadBtn('entry_exit','Upload Entry/Exit Video','Analyze store entry and exit'))}

      ${card('Unique Shoppers','occupancy','#8B5CF6',
        'M16 11a4 4 0 10-8 0 4 4 0 008 0zM2 21c0-4 4-6 8-6s8 2 8 6',
        uni!==null?uni:'—','Unique visitors detected',uniTrend,null,'uniques')}

      ${card('Queue Now','queue','#F59E0B',
        'M3 7h7v14H3zM14 3h7v18h-7z',
        queueTotal!==null?queueTotal+' person'+(queueTotal===1?'':'s'):'—','Customers currently waiting',queueTrend,
        uploadBtn('counter','Upload Counter Video','Analyze queue at checkout'))}

      ${card('Dwell Time','dwell','#2DD4BF',
        'M12 8v4l3 3M21 12a9 9 0 11-18 0 9 9 0 0118 0z',
        dwTxt,'Average customer visit duration',dwellTrend,null)}

      ${shelfCard(shelfHealth,shelfOut,shelfLow,shelfTotal)}

      ${card('AI Suggestions','suggestions','#6366F1',
        'M9 18h6M10 21h4M12 3a6 6 0 00-4 10c.7.7 1 1.5 1 2h6c0-.5.3-1.3 1-2a6 6 0 00-4-10z',
        live?aiCount:'—','New insights',null,null)}
    </div>

    <div class="ai-banner">
      <div class="bulb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10c.7.7 1 1.5 1 2h6c0-.5.3-1.3 1-2a6 6 0 00-4-10z"/></svg></div>
      <div style="flex:1">
        <div class="tag">AI Suggestion</div>
        <div class="msg ${rec?'':'none'}" id="aiMsg">${rec?esc(rec.text||'Recommendation available.'):'No recommendations available yet.'}</div>
      </div>
    </div>
    <div class="dashboard-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.5 18 2.5-8 8-2.5zM12 12l6-6"/></svg>Click any metric card to view detailed analytics</div>
  `;
  bindCardClicks();
}
const uploadBtn=(kind,main,help)=>`<button class="upload-cta" data-upload="${kind}">
    <span class="u-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg></span>
    <span class="u-txt"><span class="u-main">${main}</span><span class="u-help">${help}</span></span>
  </button>`;
function card(title,target,acc,icon,val,sub,trend,upload,dkey){

    <div class="foot">${upload||'<span class="hint">&nbsp;</span>'}</div>

function shelfCard(health,out,low,total){
  const val=health!=null?health+'%':'—';
  return `<div class="metric" data-card="shelf" style="--acc:#EC4899">
    <div class="glow"></div>
    <div class="m-top">
      <span class="m-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h16a1 1 0 011 1v4H3V4a1 1 0 011-1zM3 10h7v11H4a1 1 0 01-1-1zM14 10h7v10a1 1 0 01-1 1h-6z"/></svg></span>
      <span class="m-arr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16m-7-7l7 7-7 7"/></svg></span>
    </div>

      <span class="s"><span class="d amber"></span>Low Stock</span>
      <span class="s"><span class="d red"></span>Out of Stock</span>
    </div>
    <div class="foot">${uploadBtn('shelf','Upload Shelf Video','Analyze shelf inventory')}</div>

function bindCardClicks(){
  document.querySelectorAll('.metric').forEach(m=>{
    m.addEventListener('click',e=>{
      if(e.target.closest('.upload-cta'))return;
      const t=m.dataset.card; if(t)showView(t);

// ---- in-place patches (no DOM/canvas rebuild) so live updates never flicker
function patchDashboard(){
  const d=dashCompute();
  setBy('.metric[data-patch="occupancy"] .m-val', d.occ!=null?d.occ:'—');
  setBy('.metric[data-patch="occupancy"] .m-sub','People currently in store');
  setTrend('.metric[data-patch="occupancy"] .m-trend', d.occTrend);
  setBy('.metric[data-patch="uniques"] .m-val', d.uni!=null?d.uni:'—');
  setBy('.metric[data-patch="uniques"] .m-sub','Unique visitors detected');
  setTrend('.metric[data-patch="uniques"] .m-trend', d.uniTrend);
  setBy('.metric[data-patch="queue"] .m-val', d.queueTotal!=null?d.queueTotal+' person'+(d.queueTotal===1?'':'s'):'—');
  setBy('.metric[data-patch="queue"] .m-sub','Customers currently waiting');
  setTrend('.metric[data-patch="queue"] .m-trend', d.queueTrend);
  setBy('.metric[data-patch="dwell"] .m-val', d.dwTxt);
  setBy('.metric[data-patch="dwell"] .m-sub','Average customer visit duration');
  setTrend('.metric[data-patch="dwell"] .m-trend', d.dwellTrend);
  setBy('.metric[data-patch="shelf"] .m-val', d.shelfHealth!=null?d.shelfHealth+'%':'—');
  setBy('.metric[data-patch="shelf"] .m-sub','Items in stock');
  setBy('.metric[data-patch="suggestions"] .m-val', d.live?d.aiCount:'—');
  setBy('.metric[data-patch="suggestions"] .m-sub','New insights');
  const ab=$('aiMsg'); if(ab){ab.textContent=d.rec?d.rec.text||'Recommendation available.':'No recommendations available yet.';ab.className='msg'+(d.rec?'':' none');}
}
function patchOccupancy(){
  const c=CUR(), m=HIST.minutes||[], h=HIST.hourly||[];
  const occ=c?.footfall, peak=Math.max(0,...m.map(x=>x.peak_occupancy));
  const st=$('occ-stats');
  if(st)st.innerHTML=
    statCard('Current Occupancy',c?num(occ?.occupancy)??'—':'—','#3B82F6')+
    statCard('Total Entries Today',c?num(occ?.total_entries)??0:'—','#34D399')+
    statCard('Total Exits Today',c?num(occ?.total_exits)??0:'—','#F87171')+
    statCard('Peak Occupancy',m.length?peak:'—','#8B5CF6');
  if(m.length){
    const L=m.map(x=>fmtTime(x.ts));
    upChart('occChart',ch=>{ch.data.labels=L;ch.data.datasets[0].data=m.map(x=>x.avg_occupancy);
      ch.data.datasets[1].data=m.map(x=>x.entries);ch.data.datasets[2].data=m.map(x=>x.exits);ch.update('none');});
    upChart('occHour',ch=>{ch.data.labels=h.map(x=>fmtTime(x.ts));ch.data.datasets[0].data=h.map(x=>x.entries);ch.update('none');});
    upChart('occBar',ch=>{ch.data.labels=h.map(x=>fmtTime(x.ts));ch.data.datasets[0].data=h.map(x=>x.entries);
      ch.data.datasets[1].data=h.map(x=>x.exits);ch.update('none');});
    upChart('occPeak',ch=>{const pk=(HIST.peak_hours||[]).slice(0,8);
      ch.data.labels=pk.map(x=>x.hour+':00');ch.data.datasets[0].data=pk.map(x=>x.avg_footfall);ch.update('none');});
  }
  bindHeat('occHeatImg');
}
function patchQueue(){
  const c=CUR(), m=HIST.minutes||[]; const q=c?.queues||{}; const p=q.predictions||{};
  const meas=q.measured_wait_minutes||{}; const mv=Object.values(meas).filter(x=>x&&x.count);
  const wait=waitText(q); const nowNum=num(q.total)??0;
  const st=$('queue-stats');
  if(st)st.innerHTML=
    statCard('Current Queue',c?(num(q.total)??'—'):'—','#F59E0B')+
    statCard('Average Wait Time',wait,'#F59E0B')+
    statCard('Peak Queue Today',m.length?Math.max(0,...m.map(x=>x.peak_queue)):'—','#FBBF24');
  const pq=$('queuePer'); if(pq)pq.innerHTML=perCheckout(q,meas);
  if(c)upChart('predChart',ch=>{const p5=p['5min']??p['predicted_queue_length_5min'],p10=p['10min']??p['predicted_queue_length_10min'];

function perCheckout(q,meas){

    q.queues.map(x=>`<tr><td>${esc(x.queue_id)}</td><td>${x.length}</td><td>${badge(x.status)}</td></tr>`).join('')+'</tbody></table>';

function waitText(q){
  const w=q.wait_minutes;
  if(typeof w==='number')return Number(w).toFixed(1)+' min';
  const a=mean(Object.values(w||{}));return a!=null?a.toFixed(1)+' min':'—';
}
function bindWaitChart(q,meas,mv){
  const el=E('waitChart'); if(!el)return;
  const w=Object.entries(q.wait_minutes||{}).filter(([,v])=>num(v)!=null);
  if(!w.length&&!mv.length){E('waitList').innerHTML='<div class="empty">Select a checkout zone to see wait estimates.</div>';return;}
  const mm=Object.entries(meas).filter(([,v])=>v&&v.count);
  const labels=w.map(([k])=>k);
  const cfg={type:'bar',data:{labels,datasets:[
    {label:'est (rule)',data:w.map(([,v])=>v),backgroundColor:'#3B82F6'},
    {label:'measured avg',data:w.map(([k])=>{const x=meas[k];return x&&x.count?x.avg_wait_minutes:null;}),backgroundColor:'#F59E0B'}]},options:{...baseOpts}};
  const prev=charts.waitChart;
  if(prev&&prev.canvas&&E('waitChart')&&prev.canvas.parentNode===el.parentNode&&el.parentNode.contains(prev.canvas)){
    prev.data=cfg.data; prev.update('none');
  }else{chart('waitChart',cfg);}
  E('waitList').innerHTML=mm.length?
    '<table><thead><tr><th>Checkout</th><th>Measured avg</th><th>Max</th></tr></thead><tbody>'+
    mm.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${Number(v.avg_wait_minutes).toFixed(1)} min</td><td>${Number(v.max_wait_minutes).toFixed(1)} min</td></tr>`).join('')+'</tbody></table>':
    '<div class="empty">No measured wait data yet.</div>';
}

// ================================================================ SUGGESTIONS
function renderSuggestions(){
  const c=CUR();
  const cards=[];
  if(REC)cards.push(recCard('HIGH','Queue','#F87171',REC.text||'Open an additional counter.','Reduce customer wait time','Current queue / forecast'));
  const high=(c?.alerts?.active||[]).filter(a=>a.severity==='HIGH');
  const warn=(c?.alerts?.active||[]).filter(a=>a.severity==='WARNING');
  high.forEach(a=>cards.push(recCard('HIGH',a.type==='camera'?'Camera':'Alert','#F87171',a.message,'Resolve the alert','Alerts')));
  warn.forEach(a=>cards.push(recCard('MEDIUM',a.type==='camera'?'Camera':'Alert','#FBBF24',a.message,'Monitor closely','Alerts')));
  const sho=c?.shelves||[];
  sho.filter(s=>['OUT','OUT_OF_STOCK'].includes(s.status)).forEach(s=>cards.push(recCard('HIGH','Shelf','#F87171',`Shelf ${s.shelf_id||s.id} is out of stock. Restock the affected products.`,'Restore availability','Shelf Health')));
  sho.filter(s=>['LOW','LOW_STOCK'].includes(s.status)).forEach(s=>cards.push(recCard('MEDIUM','Shelf','#FBBF24',`Shelf ${s.shelf_id||s.id} has low inventory. Restock soon.`,'Prevent stock-out','Shelf Health')));
  const d=c?.dwell?.avg_dwell_s||{};
  if(Object.keys(d).length){
    const sorted=Object.entries(d).sort((a,b)=>b[1]-a[1]);
    const top=sorted[0][0];
    cards.push(recCard('OPPORTUNITY','Dwell','#3B82F6',`Customers spend the most time in the "${top}" area. Consider promoting related products here.`,'Increase conversion','Dwell Time'));
  }
  if(!cards.length)cards.push({none:true});
  $('view-suggestions').innerHTML=`
    <div class="analytics-header">
      <div>
        <button class="back" data-back>← Back to Dashboard</button>
        <h2 style="margin-top:8px">AI Suggestions</h2>
        <div class="sub">Actionable recommendations generated from your analytics system.</div>
      </div>
    </div>
    ${cards[0]&&cards[0].none?'<div class="panel">'+emptyState('No AI suggestions yet','Run an analysis to generate actionable recommendations.')+'</div>':cards.join('')}
  `;
  bindCommon();
}
function recCard(priority,cat,color,text,impact,related){
  const pc=priority==='HIGH'?'high':priority==='MEDIUM'?'medium':'opportunity';
  return `<div class="rec-card" style="--pc:${color}">
    <div class="r-top"><span class="pill-pr ${pc}">${priority} PRIORITY</span><span class="cat">${cat}</span></div>
    <div class="r-text">${esc(text)}</div>
    <div class="r-impact">Expected impact: <b>${esc(impact)}</b> · Related: ${esc(related)}</div>
  </div>`;
}

// ================================================================ REPORTS
function renderReports(){
  const daily=HIST.daily||[]; const runs=RUNS||[];
  $('view-reports').innerHTML=`
    <div class="analytics-header">
      <div>
        <button class="back" data-back>← Back to Dashboard</button>
        <h2 style="margin-top:8px">Reports</h2>
        <div class="sub">Daily and weekly analytics summaries, ready to export.</div>
      </div>
      <div class="actions"><a class="btn ghost" href="/api/analytics/report.csv" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>Export CSV</a></div>
    </div>
    <div class="stats">
      ${statCard('Total Visits',daily.reduce((a,d)=>a+d.visits,0)||'—','#3B82F6')}
      ${statCard('Avg Occupancy',mean(daily.map(d=>d.peak_occupancy))!==null?mean(daily.map(d=>d.peak_occupancy)).toFixed(1):'—','#8B5CF6')}
      ${statCard('Saved Runs',runs.length||'—','#14B8A6')}
    </div>
    ${daily.length?`<div class="panel"><h3>Daily summary</h3>
      <table><thead><tr><th>Date</th><th>Visits</th><th>Peak occupancy</th><th>Peak queue</th><th>Congested (min)</th></tr></thead><tbody>
      ${daily.map(d=>`<tr><td>${esc(d.date)}</td><td>${d.visits}</td><td>${d.peak_occupancy}</td><td>${d.peak_queue}</td><td>${d.congested_minutes_est}</td></tr>`).join('')}
      </tbody></table></div>`:emptyState('No reports yet','Run analyses to generate daily summaries.')}
    ${runs.slice(0,8).length?`<div class="panel"><h3>Recent analysis runs</h3>
      <table><thead><tr><th>Kind</th><th>When</th><th>Frames</th><th>Unique</th></tr></thead><tbody>
      ${runs.slice(0,8).map(r=>`<tr><td>${esc(KINDS[r.kind]?.title||r.kind||'—')}</td><td>${fmtDate(r.ended_ts)}</td><td>${r.frames}</td><td>${r.summary?.unique_shoppers||'—'}</td></tr>`).join('')}
      </tbody></table></div>`:''}

// ================================================================ SETTINGS
function renderSettings(){
  const c=CFG||{}; const priv=c.privacy||{};
  $('view-settings').innerHTML=`

      <div>
        <button class="back" data-back>← Back to Dashboard</button>

// ================================================================ shared binds
function bindTabs(group){
  document.querySelectorAll(`[data-tabs="${group}"] .tab`).forEach(t=>{
    t.addEventListener('click',()=>{
      const g=t.closest('[data-tabs]').dataset.tabs;
      document.querySelectorAll(`[data-tabs="${g}"] .tab`).forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll(`#${g}-${t.dataset.tab}`).forEach(p=>p.classList.add('active'));
      document.querySelectorAll(`[id^="${g}-"]`).forEach(p=>{if(!p.classList.contains('active')&&p.classList.contains('tab-pane'))p.classList.remove('active');});
    });
  });
}
function bindCommon(){
  document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>showView('dashboard')));
  document.querySelectorAll('[data-upload]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openUpload(b.dataset.upload);}));
}
let heatCache={};
function bindHeat(id){
  const img=E(id); if(!img)return;
  let base=null;
  if(SNAP)base='/api/heatmap.png';
  else if(RUNS[0])base=`/api/runs/${RUNS[0].id}/heatmap.png`;
  if(!base)return;
  const now=Date.now(), hc=heatCache[id]||{};
  if(hc.base!==base){img.src=base+'?v='+now;heatCache[id]={base,t:now};return;}
  if(now-(hc.t||0)>=15000){img.src=base+'?v='+now;heatCache[id]={base,t:now};}
}
function emptyState(title,sub,withBtn=true){
  return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6M8 6h8M4 3h16a1 1 0 011 1v16a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1z"/></svg>
    <div class="t">${title}</div><div class="s">${sub}</div></div>`;
}
function statCard(k,v,color){return `<div class="stat"><div class="k">${k}</div><div class="v" style="color:${color}">${esc(v)}</div></div>`;}

// ================================================================ UPLOAD MODAL
let uploadKind='entry_exit', analyzing=false, pendingFile=null;
function openUpload(kind){
  uploadKind=kind; analyzing=false; pendingFile=null;
  const k=KINDS[kind]||KINDS.entry_exit;
  $('upTitle').textContent=k.title; $('upDesc').textContent=k.desc;
  $('upIco').innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V7m0 0l-5 5m5-5l5 5M5 3h14"/></svg>`;
  $('upIco').style.cssText=`--acc:${KINDS[kind].kind==='counter'?'#F59E0B':kind==='shelf'?'#EC4899':'#3B82F6'}`;
  $('upBody').innerHTML=`
    <div class="drop" id="dropZone">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg></div>
      <div class="t">Drag &amp; Drop Video Here</div>
      <div class="s">or <span style="color:var(--blue);font-weight:700">Click to Browse Files</span></div>
      <div class="fmt">Supported formats: MP4, AVI, MOV</div>
    </div>
    <div id="fileRow"></div>
    <div class="m-foot">
      <button class="btn ghost" data-close="1">Cancel</button>
      <button class="btn solid" id="analyzeBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Analyze Video</button>
    </div>
  `;
  const dz=$('dropZone'), fi=$('fileInput');
  dz.onclick=()=>fi.click();
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
  dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files[0])selectFile(e.dataTransfer.files[0]);};
  fi.onchange=()=>{if(fi.files[0])selectFile(fi.files[0]);fi.value='';};
  $('analyzeBtn').onclick=analyzeVideo;
  $('uploadOverlay').classList.remove('hidden');
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeUpload));
}
function selectFile(file){
  pendingFile=file;
  const sz=file.size?Math.round(file.size/1024/1024*10)/10+' MB':'';
  E('fileRow').innerHTML=`<div class="file-row">
    <svg viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" style="width:22px;height:22px;flex:none"><path d="M7 3h7l5 5v13H7z"/></svg>
    <span class="n">${esc(file.name)}</span><span class="sz">${sz}</span></div>`;
  E('analyzeBtn').disabled=false;
}
async function analyzeVideo(){
  const file=pendingFile;
  if(!file){const dz=$('dropZone');dz.click();return;}
  analyzing=true;
  E('upBody').innerHTML=`
    <div class="analyzing">
      <div class="spin"></div>
      <div style="font-size:14px;font-weight:700">AI is analyzing your video...</div>
      <div class="steps" id="steps">
        <div class="st done" id="st0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg><span>Uploading video...</span></div>
        <div class="st cur" id="st1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>Processing frames...</span></div>
        <div class="st" id="st2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>Running AI detection...</span></div>
        <div class="st" id="st3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>Generating analytics...</span></div>
      </div>
    </div>`;
  try{
    const fd=new FormData(); fd.append('file',file); fd.append('kind',uploadKind);
    const r=await POST('/api/run/video',fd);
    setStep(2); await sleep(700); setStep(3);
    await sleep(700); setStep(4,...['Analysis complete ✓'],true);
    await sleep(600);
    closeUpload(); showView('dashboard');
  }catch(e){
    E('upBody').innerHTML=`<div class="empty" style="padding:20px"><div class="t">Upload failed</div><div class="s">${esc(e.message)}</div></div>
      <div class="m-foot"><button class="btn ghost" data-close="1">Close</button></div>`;
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeUpload));
  }
}
function setStep(n,msg,all){
  for(let i=0;i<4;i++){
    const el=E('st'+i);
    if(el){el.className='st'+(i<n?' done':i===n?' cur':'');if(i<n)el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg><span>'+(msg&&all?msg:'')+'</span>';}
  }
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function POST(url,body){
  const r=await fetch(url,{method:'POST',body});
  let j={}; try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error(j.detail||('status '+r.status));
  return j;
}
function closeUpload(){E('uploadOverlay').classList.add('hidden');}
E('uploadOverlay').addEventListener('click',e=>{if(e.target.id==='uploadOverlay')closeUpload();});

// ================================================================ data polling
async function refreshStatus(){
  try{
    const r=await fetch('/api/run/status');const s=await r.json();
    const live=!!s.running;
    const pill=$('connPill');
    pill.textContent=live?'● live · '+esc(s.run.mode||''):'◦ idle';
    pill.className='conn '+(live?'live':'off');
    $('sysSub').textContent=live?`${esc(s.run.mode||'')} · ${s.running?'running':'finished'}`:'Websocket connected';
  }catch(e){}
}
async function refreshRec(){
  try{const r=await fetch('/api/analytics/recommendation');const j=await r.json();REC=j.recommendation;}catch(e){REC=null;}
  if(currentView==='dashboard')liveApply('dashboard');
}
async function refreshRuns(){
  try{const r=await fetch('/api/runs');const j=await r.json();RUNS=j.runs||[];}
  catch(e){RUNS=[];}
  if(currentView==='dashboard')liveApply('dashboard');
}
async function refreshHistory(){
  try{
    const r=await fetch('/api/analytics/history');const j=await r.json();
    if(j.live){HIST=j; if(['occupancy','queue','reports'].includes(currentView))liveApply(currentView);}
  }catch(e){}
}
async function refreshConfig(){
  try{const r=await fetch('/api/config');const j=await r.json();CFG=j;}
  catch(e){CFG=null;}
}

function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  const ws=new WebSocket(`${proto}://${location.host}/ws/live`);
  ws.onopen=()=>{$('connPill').textContent='● live';$('connPill').className='conn live';
    $('sysSub').textContent='Websocket connected';};
  ws.onmessage=ev=>{
    try{const msg=JSON.parse(ev.data);
      if(msg.type==='live_snapshot'){
        const cam=Object.values(msg.data||{})[0];
        if(cam){SNAP=cam;
          if(['dashboard','occupancy','queue','shelf','dwell','suggestions'].includes(currentView))liveApply(currentView);
        }
      }
    }catch(e){}
  };
  ws.onclose=()=>{$('connPill').textContent='◦ disconnected';$('connPill').className='conn off';setTimeout(connect,2000);};
}

// ---------------------------------------------------------------- boot
$('demoBtn').onclick=async()=>{try{await POST('/api/run/demo',new URLSearchParams({kind:'entry_exit'}));}catch(e){console.log(e);}};
$('stopBtn').onclick=async()=>{try{await POST('/api/run/stop');}catch(e){}};

buildNav();
const initHash=location.hash.replace('#/','');
if(initHash&&['dashboard','occupancy','queue','shelf','dwell','suggestions','reports','settings'].includes(initHash))showView(initHash);
else showView('dashboard');
refreshStatus(); refreshRec(); refreshRuns(); refreshHistory(); refreshConfig();
setInterval(refreshStatus,3000); setInterval(refreshRec,4000); setInterval(refreshRuns,8000); setInterval(refreshHistory,10000); setInterval(refreshConfig,15000);
connect();
</script>
